<!DOCTYPE html>

  <meta name="description" content="NxtGrnd AI uses advanced AI to analyze your resume, map your career path, and build a personalized roadmap to your dream career. Join the open beta today." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0F172A; background: #fff; -webkit-font-smoothing: antialiased; }
    .page { background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 40%, #FFFFFF 100%); min-height: 100vh; overflow-x: hidden; }
    button { font-family: 'Inter', sans-serif; }
    button:active { transform: scale(0.98); }
    a { color: inherit; }
    .hidden { display: none !important; }

    #beta-form input:focus,
    #beta-form select:focus {
      outline: none;
      border-color: #3B82F6 !important;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15) !important;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 0 5px rgba(34,197,94,0); }
    }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .hero-preview { display: none !important; }
      .features-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .how-grid { grid-template-columns: 1fr !important; }
      .pricing-grid { grid-template-columns: 1fr !important; }
      .nav-links { display: none !important; }
    }
    @media (max-width: 600px) {
      .features-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

// ────────────────────────────────────────────────────────────────
// NAV
// ────────────────────────────────────────────────────────────────
function LandingNav() {
  return (
    <nav style={landingNavStyles.root}>
      <div style={landingNavStyles.brand}>
        <img src="ng-logo.png" style={{width: 32, height: 32, borderRadius: 8}} alt="NxtGrnd"/>
        <div style={{fontWeight: 800, fontSize: 17, letterSpacing: '-0.01em'}}>NxtGrnd <span style={landingNavStyles.ai}>AI</span></div>
      </div>
      <div className="nav-links" style={landingNavStyles.links}>
        <a style={landingNavStyles.link} href="#features">Features</a>
        <a style={landingNavStyles.link} href="#how">How it works</a>
        <a style={landingNavStyles.link} href="#pricing">Pricing</a>
        <a style={landingNavStyles.link} href="#signup">Beta</a>

}

// HERO

function FeaturesSection() {
  const features = [
    { icon: 'compass',     title: 'AI Career Compass',  desc: 'Personalized career paths scored from your skills, interests, and goals.' },
    { icon: 'file-text',   title: 'Resume ATS Scanner', desc: 'Optimize your resume for any job description in under a minute.' },

  return (
    <section id="features" style={featuresStyles.root}>
      <div style={featuresStyles.header}>

            <div style={featuresStyles.cardTitle}>{f.title}</div>
            <div style={featuresStyles.cardDesc}>{f.desc}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

// HOW IT WORKS
// ────────────────────────────────────────────────────────────────
function HowItWorks() {
  const steps = [
    { n: '01', title: 'Set your goals',          desc: 'Tell us where you are and where you want to be. Takes 2 minutes.' },
    { n: '02', title: 'Get your AI career plan', desc: 'Personalized paths, learning tracks, and target roles — ready to go.' },
    { n: '03', title: 'Land your opportunity',   desc: 'Apply with tuned resumes, mentor intros, and offer comparisons.' },

  return (
    <section id="how" style={howStyles.root}>
      <div style={howStyles.header}>
        <div style={howStyles.overline}>HOW IT WORKS</div>
        <h2 style={howStyles.title}>Three steps to your next move.</h2>

<script>
function handleFormSubmit(e) {
  e.preventDefault();
  const form = document.getElementById('beta-form');
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Submitting...';
  btn.disabled = true;

  fetch(form.action, {
    method: 'POST',
    body: new FormData(form),
    headers: { 'Accept': 'application/json' }
  })
  .then(res => {
    if (res.ok) {
      showSuccess();
      form.reset();
    } else {
      btn.textContent = 'Something went wrong. Try again.';
      btn.disabled = false;
    }
  })
  .catch(() => {
    btn.textContent = 'Something went wrong. Try again.';
    btn.disabled = false;
  });
}

function showSuccess() {
  document.getElementById('submit-btn').classList.add('hidden');
  document.getElementById('form-success').classList.remove('hidden');
}
</script>
